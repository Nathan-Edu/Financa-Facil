<main class="receitas-page">

  <app-page-header
    title="Receitas"
    subtitle="Gerencie todas as suas entradas financeiras">

    <app-button
      color="success"
      icon="add"
      (click)="abrirNovaReceita()">
      Nova Receita
    </app-button>

  </app-page-header>

  <section class="summary-grid">

    <app-stat-card
      title="Total Recebido"
      [value]="totalRecebido"
      subtitle="Somatório das receitas"
      icon="payments"
      color="success">
    </app-stat-card>

    <app-stat-card
      title="Mês Atual"
      [value]="totalMesAtual"
      subtitle="Receitas do mês corrente"
      icon="calendar_month"
      color="primary">
    </app-stat-card>

    <app-stat-card
      title="Receitas"
      [value]="quantidadeReceitas"
      subtitle="Registros cadastrados"
      icon="trending_up"
      color="violet">
    </app-stat-card>

  </section>

  <app-card
    title="Suas Receitas"
    subtitle="Lista de receitas cadastradas no sistema">

    <div class="filters">

      <app-search-input
        label="Buscar"
        placeholder="Buscar receitas..."
        [(value)]="search">
      </app-search-input>

      <app-select
        label="Categoria"
        [options]="categorias"
        [(value)]="categoria">
      </app-select>

    </div>

    @if (receitasFiltradas.length === 0) {

      <app-empty-state
        icon="receipt_long"
        title="Nenhuma receita encontrada"
        description="Cadastre uma nova receita ou ajuste os filtros de busca.">
      </app-empty-state>

    } @else {

      <div class="finance-list">

        @for (
          receita of receitasFiltradas;
          track receita.id
        ) {

          <app-finance-item
            [title]="receita.descricao"
            [category]="receita.categoria"
            [date]="receita.data"
            [value]="receita.valorFormatado"
            type="income"
            (edit)="editarReceita(receita)"
            (delete)="solicitarExclusao(receita)">
          </app-finance-item>

        }

      </div>

      <app-pagination
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        (pageChange)="mudarPagina($event)">
      </app-pagination>

    }

  </app-card>

  @if (showModal) {

    <app-modal
      [title]="tituloModal"
      [subtitle]="subtituloModal"
      size="medium"
      (close)="fecharModal()">

      <div modal-body>

        <div class="form-grid">

          <app-search-input
            label="Descrição"
            placeholder="Descrição da receita"
            [(value)]="descricao">
          </app-search-input>

          <app-select
            label="Categoria"
            [options]="categoriasFormulario"
            [(value)]="categoriaFormulario">
          </app-select>

          <app-currency-input
            label="Valor"
            [(value)]="valor">
          </app-currency-input>

          <app-date-input
            label="Data"
            [required]="true"
            [(value)]="data">
          </app-date-input>

          <app-textarea
            label="Observações"
            placeholder="Digite uma observação..."
            [(value)]="observacao">
          </app-textarea>

        </div>

      </div>

      <div modal-footer>

        <app-button
          color="outline"
          (click)="fecharModal()">
          Cancelar
        </app-button>

        <app-button
          color="success"
          (click)="salvarReceita()">
          Salvar
        </app-button>

      </div>

    </app-modal>

  }

  @if (showConfirmDialog) {

    <app-confirm-dialog
      title="Excluir receita"
      message="Deseja realmente excluir esta receita? Esta ação não poderá ser desfeita."
      confirmText="Excluir"
      cancelText="Cancelar"
      (confirm)="confirmarExclusao()"
      (cancel)="cancelarExclusao()">
    </app-confirm-dialog>

  }

</main>
