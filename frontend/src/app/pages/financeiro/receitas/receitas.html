<main class="receitas-page">

  <app-page-header
    title="Receitas"
    subtitle="Gerencie todas as suas entradas financeiras">

    <app-button color="success" icon="add" (click)="showModal = true">
      Nova Receita
    </app-button>

  </app-page-header>

  <section class="summary-grid">

    <app-stat-card
      title="Total Recebido"
      value="R$ 5.970,50"
      subtitle="Somatório das receitas"
      icon="payments"
      color="success">
    </app-stat-card>

    <app-stat-card
      title="Mês Atual"
      value="R$ 5.850,00"
      subtitle="Receitas em janeiro"
      icon="calendar_month"
      color="primary">
    </app-stat-card>

    <app-stat-card
      title="Receitas"
      value="3"
      subtitle="Registros cadastrados"
      icon="trending_up"
      color="violet">
    </app-stat-card>

  </section>

  <app-card
    title="Suas Receitas"
    subtitle="Lista de receitas cadastradas no sistema">

    <div class="filters">
      <app-search-input
        label="Buscar"
        placeholder="Buscar receitas..."
        [(value)]="search">
      </app-search-input>

      <app-select
        label="Categoria"
        [options]="categorias"
        [(value)]="categoria">
      </app-select>
    </div>

    @if (receitasFiltradas.length === 0) {

      <app-empty-state
        icon="receipt_long"
        title="Nenhuma receita encontrada"
        description="Cadastre uma nova receita ou ajuste os filtros de busca.">
      </app-empty-state>

    } @else {

      <div class="finance-list">

        @for (receita of receitasFiltradas; track receita.id) {

          <app-finance-item
            [title]="receita.descricao"
            [category]="receita.categoria"
            [date]="receita.data"
            [value]="receita.valorFormatado"
            type="income"
            (edit)="editarReceita()"
            (delete)="excluirReceita()">
          </app-finance-item>

        }

      </div>

      <app-pagination
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        (pageChange)="mudarPagina($event)">
      </app-pagination>

    }

  </app-card>

  @if (showModal) {

    <app-modal
      title="Nova Receita"
      subtitle="Cadastre uma nova entrada financeira"
      size="medium"
      (close)="showModal = false">

      <div modal-body>
        <div class="form-grid">

          <app-search-input
            label="Descrição"
            placeholder="Descrição da receita">
          </app-search-input>

          <app-select
            label="Categoria"
            [options]="['Trabalho', 'Freelance', 'Investimentos', 'Outros']">
          </app-select>

          <app-currency-input label="Valor"></app-currency-input>

          <app-date-input label="Data" [required]="true"></app-date-input>

          <app-textarea
            label="Observações"
            placeholder="Digite uma observação...">
          </app-textarea>

        </div>
      </div>

      <div modal-footer>
        <app-button color="outline" (click)="showModal = false">
          Cancelar
        </app-button>

        <app-button color="success" (click)="salvarReceita()">
          Salvar
        </app-button>
      </div>

    </app-modal>

  }

</main>
