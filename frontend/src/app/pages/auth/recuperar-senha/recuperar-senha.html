<main class="recuperar-page">
  <app-card class="recuperar-card">

    <div class="recuperar-header">
      <span class="logo-circle">FF</span>

      <h1>Recuperar senha</h1>

      <p>
        Informe seu e-mail para receber as instruções de recuperação.
      </p>
    </div>

    @if (!enviado) {
      <form
        class="recuperar-form"
        (submit)="$event.preventDefault(); enviarLink()">

        <app-input
          label="E-mail"
          icon="mail"
          type="email"
          placeholder="Digite seu e-mail"
          [(value)]="email">
        </app-input>

        @if (erro) {
          <div class="recuperar-error">{{ erro }}</div>
        }

        <app-button
          type="submit"
          [disabled]="carregando"
          color="primary">
          {{ carregando ? 'Enviando...' : 'Enviar link' }}
        </app-button>
      </form>
    } @else {
      <div class="success-message">
        <span class="success-icon">✓</span>

        <h2>Verifique seu e-mail</h2>

        <p>
          As instruções para redefinir sua senha foram enviadas para
          <strong>{{ email }}</strong>.
        </p>
      </div>
    }

    <app-divider text="ou"></app-divider>

    <div class="recuperar-footer">
      <button
        type="button"
        (click)="voltarLogin()">
        Voltar para o login
      </button>
    </div>

  </app-card>
</main>
