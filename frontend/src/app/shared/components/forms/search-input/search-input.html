<div class="form-field">

  @if (label) {
    <label>
      {{ label }}

      @if (required) {
        <span>*</span>
      }
    </label>
  }

  <div class="control">
    <mat-icon>search</mat-icon>

    <input
      type="text"
      [placeholder]="placeholder"
      [value]="value"
      [disabled]="disabled"
      (input)="onInput($event)"
    />

    @if (value && !disabled) {
      <button type="button" (click)="clear()">
        <mat-icon>close</mat-icon>
      </button>
    }
  </div>

  @if (hint) {
    <small>{{ hint }}</small>
  }

</div>
