<label class="password-field">

  @if(label){

    <span class="password-label">

      {{label}}

      @if(required){

        <span class="required">*</span>

      }

    </span>

  }

  <div
    class="password-wrapper"
    [class.has-error]="error"
    [class.disabled]="disabled">

    <mat-icon class="left-icon">
      lock
    </mat-icon>

    <input

      [attr.type]="mostrarSenha ? 'text' : 'password'"

      [value]="value"

      [placeholder]="placeholder"

      [required]="required"

      [disabled]="disabled"

      [readOnly]="readonly"

      [attr.autocomplete]="autocomplete"

      (input)="atualizarValor($event)">

    <button

      type="button"

      class="toggle-password"

      [disabled]="disabled"

      (click)="alternarVisibilidade()">

      <mat-icon>

        {{ mostrarSenha ? 'visibility_off' : 'visibility' }}

      </mat-icon>

    </button>

  </div>

  @if(error){

    <span class="password-message error">

      {{error}}

    </span>

  } @else if(hint){

    <span class="password-message">

      {{hint}}

    </span>

  }

</label>
