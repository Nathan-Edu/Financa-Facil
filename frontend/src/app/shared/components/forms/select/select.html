<div class="form-field">

  @if (label) {
    <label>
      {{ label }}

      @if (required) {
        <span>*</span>
      }
    </label>
  }

  <select
    [value]="value"
    [disabled]="disabled"
    (change)="onChange($event)">

    @for (item of options; track item) {
      <option [value]="item">
        {{ item }}
      </option>
    }

  </select>

  @if (hint) {
    <small>{{ hint }}</small>
  }

</div>
