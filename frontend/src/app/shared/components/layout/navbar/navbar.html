    class="logo"
    routerLink="/dashboard">

  </div>

  <nav class="nav-menu">

    <a
      class="nav-item"
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }">

      <mat-icon>home</mat-icon>
      <span>Dashboard</span>
    </a>

    <a
      class="nav-item"
      routerLink="/receitas"
      routerLinkActive="active">

      routerLink="/alertas"
      routerLinkActive="active">

      <mat-icon>notifications</mat-icon>

>
