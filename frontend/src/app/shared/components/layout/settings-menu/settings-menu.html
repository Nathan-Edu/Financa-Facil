<button mat-icon-button [matMenuTriggerFor]="settingsMenu" class="settings-btn">
  <mat-icon>settings</mat-icon>
</button>

<mat-menu #settingsMenu="matMenu" class="settings-panel">

  <div class="menu-header">
    <div class="menu-header-icon">
      <mat-icon>settings</mat-icon>
    </div>

    <div>
      <h3>Configurações</h3>
      <p>Personalize sua experiência</p>
    </div>
  </div>

  <button mat-menu-item [matMenuTriggerFor]="profileMenu">

    <mat-icon>person</mat-icon>

    <div class="menu-item-content">

        <span class="menu-title">
            Perfil
        </span>

        <span class="badge">
            {{ perfilAtual }}
        </span>

    </div>

    <mat-icon class="chevron">
        chevron_right
    </mat-icon>

</button>

 <button mat-menu-item [matMenuTriggerFor]="themeMenu">

    <mat-icon>palette</mat-icon>

    <div class="menu-item-content">

        <span class="menu-title">
            Aparência
        </span>

        <span class="badge">
            {{ temaAtual }}
        </span>

    </div>

    <mat-icon class="chevron">
        chevron_right
    </mat-icon>

</button>

  <div class="menu-divider"></div>

  <button mat-menu-item>
    <mat-icon>manage_accounts</mat-icon>
    <span>Minha Conta</span>
  </button>

  <button mat-menu-item>
    <mat-icon>lock_reset</mat-icon>
    <span>Alterar Senha</span>
  </button>

  <div class="menu-divider"></div>

  <button mat-menu-item class="logout" (click)="sair()">
    <mat-icon>logout</mat-icon>
    <span>Sair</span>
  </button>

</mat-menu>

<mat-menu #profileMenu="matMenu" class="settings-panel">
  <div class="submenu-header">
    <mat-icon>person</mat-icon>
    <span>Perfil</span>
  </div>

  <button mat-menu-item (click)="alterarPerfil('Pessoal')">
    <mat-icon>
      {{ perfilAtual === 'Pessoal' ? 'radio_button_checked' : 'radio_button_unchecked' }}
    </mat-icon>
    <span>Pessoal</span>
  </button>

  <button mat-menu-item (click)="alterarPerfil('Empresa')">
    <mat-icon>
      {{ perfilAtual === 'Empresa' ? 'radio_button_checked' : 'radio_button_unchecked' }}
    </mat-icon>
    <span>Empresa</span>
  </button>
</mat-menu>

<mat-menu #themeMenu="matMenu" class="settings-panel">
  <div class="submenu-header">
    <mat-icon>palette</mat-icon>
    <span>Aparência</span>
  </div>

  <button mat-menu-item (click)="alterarTema('Dark')">

    <mat-icon>
        {{ temaAtual === 'Dark'
            ? 'radio_button_checked'
            : 'radio_button_unchecked' }}
    </mat-icon>

    <span>Dark</span>

</button>

  <button mat-menu-item (click)="alterarTema('Light')">

    <mat-icon>
        {{ temaAtual === 'Light'
            ? 'radio_button_checked'
            : 'radio_button_unchecked' }}
    </mat-icon>

    <span>Light</span>

</button>

 <button mat-menu-item (click)="alterarTema('Green')">

    <mat-icon>
        {{ temaAtual === 'Green'
            ? 'radio_button_checked'
            : 'radio_button_unchecked' }}
    </mat-icon>

    <span>Green</span>

</button>

  <button mat-menu-item (click)="alterarTema('Violet')">

    <mat-icon>
        {{ temaAtual === 'Violet'
            ? 'radio_button_checked'
            : 'radio_button_unchecked' }}
    </mat-icon>

    <span>Violet</span>

</button>

<span class="theme-dot dark"></span>
<span class="theme-dot light"></span>
<span class="theme-dot green"></span>
<span class="theme-dot violet"></span>

</mat-menu>
